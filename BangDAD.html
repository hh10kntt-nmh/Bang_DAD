<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Độ Âm Điện Pauling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
        }
        
        /* Grid Layout */
        .table-grid {
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
            gap: 2px;
            max-width: 900px;
            margin: 0 auto;
        }

        .cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            cursor: default;
            min-height: 70px;
        }

        /* Header Styles */
        .header-cell {
            background-color: #a7f3d0; /* Green-200 matching image header */
            color: #064e3b;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }
        .header-cell:hover { background-color: #6ee7b7; }
        .header-cell.active { background-color: #059669; color: white; }

        /* Diagonal Header */
        .diagonal-header {
            background: linear-gradient(to top right, #a7f3d0 49%, #064e3b 50%, #a7f3d0 51%);
            position: relative;
            cursor: default;
        }
        .lbl-group { position: absolute; top: 2px; right: 4px; font-size: 0.75rem; color: #064e3b; font-weight: bold;}
        .lbl-period { position: absolute; bottom: 2px; left: 4px; font-size: 0.75rem; color: #064e3b; font-weight: bold;}

        /* Element Colors based on image */
        .bg-blue-custom { background-color: #7dd3fc; color: #0c4a6e; } /* Sky-300 */
        .bg-red-custom { background-color: #fca5a5; color: #7f1d1d; } /* Red-300 */
        .bg-white-custom { background-color: white; }

        .symbol { font-size: 1.2rem; font-weight: 800; }
        .value { font-size: 0.9rem; font-weight: 500; }
        .z-index { position: absolute; top: 2px; left: 4px; font-size: 0.65rem; opacity: 0.7; }

        /* States */
        .dimmed { opacity: 0.1; filter: grayscale(100%); }
        .highlight { transform: scale(1.05); z-index: 10; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); border-color: #000; }

    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-slate-800">Giá trị độ âm điện Pauling</h1>
            <h1 class="text-slate-600 mt-2">Gv Nguyễn Mạnh Hưng - trường THPT Trại Cau</h1>
            <p class="text-slate-600 mt-2">Click vào <span class="font-bold text-green-700">Tiêu đề Nhóm</span> hoặc <span class="font-bold text-green-700">Số Chu kỳ</span> để lọc dữ liệu và vẽ biểu đồ.</p>
            <button onclick="reset()" class="mt-2 px-4 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-sm font-medium shadow-sm">
                Reset (Hiện tất cả)
            </button>
        </header>

        <!-- Periodic Table Section -->
        <div class="table-grid mb-8" id="periodic-table">
            <!-- Headers generated by JS -->
        </div>

        <!-- Chart Section -->
        <div class="bg-white p-4 rounded-xl shadow-lg border border-slate-200">
            <h2 class="text-lg font-bold text-slate-700 mb-2 border-b pb-2">Biểu đồ biến thiên (Hình 6.4)</h2>
            <div class="relative h-[300px] w-full">
                <canvas id="electronegativityChart"></canvas>
            </div>
            <div id="chart-desc" class="mt-2 text-sm text-slate-500 italic text-center">
                Đang hiển thị toàn bộ nguyên tố theo số hiệu nguyên tử (Z).
            </div>
        </div>
        
        <!-- Legend -->
        <div class="mt-4 flex gap-4 justify-center text-sm">
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 bg-blue-custom border border-slate-300"></div>
                <span>Nhóm IA - IIIA (Kim loại)</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 bg-red-custom border border-slate-300"></div>
                <span>Nhóm IVA - VIIA (Phi kim)</span>
            </div>
        </div>
    </div>

<script>
    // --- DATA ---
    // Color logic: Groups IA, IIA, IIIA are Blue. IVA, VA, VIA, VIIA are Red.
    const rawData = [
        // Period 1
        { p: 1, g: 'IA', sym: 'H', z: 1, val: 2.20 },
        // Period 2
        { p: 2, g: 'IA', sym: 'Li', z: 3, val: 0.98 },
        { p: 2, g: 'IIA', sym: 'Be', z: 4, val: 1.57 },
        { p: 2, g: 'IIIA', sym: 'B', z: 5, val: 2.04 },
        { p: 2, g: 'IVA', sym: 'C', z: 6, val: 2.55 },
        { p: 2, g: 'VA', sym: 'N', z: 7, val: 3.04 },
        { p: 2, g: 'VIA', sym: 'O', z: 8, val: 3.44 },
        { p: 2, g: 'VIIA', sym: 'F', z: 9, val: 3.98 },
        // Period 3
        { p: 3, g: 'IA', sym: 'Na', z: 11, val: 0.93 },
        { p: 3, g: 'IIA', sym: 'Mg', z: 12, val: 1.31 },
        { p: 3, g: 'IIIA', sym: 'Al', z: 13, val: 1.61 },
        { p: 3, g: 'IVA', sym: 'Si', z: 14, val: 1.90 },
        { p: 3, g: 'VA', sym: 'P', z: 15, val: 2.19 },
        { p: 3, g: 'VIA', sym: 'S', z: 16, val: 2.58 },
        { p: 3, g: 'VIIA', sym: 'Cl', z: 17, val: 3.16 },
        // Period 4
        { p: 4, g: 'IA', sym: 'K', z: 19, val: 0.82 },
        { p: 4, g: 'IIA', sym: 'Ca', z: 20, val: 1.00 },
        { p: 4, g: 'IIIA', sym: 'Ga', z: 31, val: 1.81 },
        { p: 4, g: 'IVA', sym: 'Ge', z: 32, val: 2.01 },
        { p: 4, g: 'VA', sym: 'As', z: 33, val: 2.18 },
        { p: 4, g: 'VIA', sym: 'Se', z: 34, val: 2.55 },
        { p: 4, g: 'VIIA', sym: 'Br', z: 35, val: 2.96 },
        // Period 5
        { p: 5, g: 'IA', sym: 'Rb', z: 37, val: 0.82 },
        { p: 5, g: 'IIA', sym: 'Sr', z: 38, val: 0.95 },
        { p: 5, g: 'IIIA', sym: 'In', z: 49, val: 1.78 },
        { p: 5, g: 'IVA', sym: 'Sn', z: 50, val: 1.96 },
        { p: 5, g: 'VA', sym: 'Sb', z: 51, val: 2.05 },
        { p: 5, g: 'VIA', sym: 'Te', z: 52, val: 2.10 },
        { p: 5, g: 'VIIA', sym: 'I', z: 53, val: 2.66 },
        // Period 6
        { p: 6, g: 'IA', sym: 'Cs', z: 55, val: 0.79 },
        { p: 6, g: 'IIA', sym: 'Ba', z: 56, val: 0.89 },
        { p: 6, g: 'IIIA', sym: 'Tl', z: 81, val: 1.62 },
        { p: 6, g: 'IVA', sym: 'Pb', z: 82, val: 2.33 },
        { p: 6, g: 'VA', sym: 'Bi', z: 83, val: 2.02 },
        { p: 6, g: 'VIA', sym: 'Po', z: 84, val: 2.00 },
        { p: 6, g: 'VIIA', sym: 'At', z: 85, val: 2.20 },
    ];

    const groups = ['IA', 'IIA', 'IIIA', 'IVA', 'VA', 'VIA', 'VIIA'];
    const periods = [1, 2, 3, 4, 5, 6];

    // --- RENDER TABLE ---
    const tableContainer = document.getElementById('periodic-table');

    function initTable() {
        tableContainer.innerHTML = '';

        // 1. Top Left Diagonal Header
        const diagonal = document.createElement('div');
        diagonal.className = 'header-cell diagonal-header';
        diagonal.innerHTML = `<span class="lbl-group">Nhóm</span><span class="lbl-period">Chu kì</span>`;
        tableContainer.appendChild(diagonal);

        // 2. Group Headers
        groups.forEach(g => {
            const el = document.createElement('div');
            el.className = 'header-cell';
            el.innerText = g;
            el.id = `h-g-${g}`;
            el.onclick = () => filter('group', g);
            tableContainer.appendChild(el);
        });

        // 3. Rows
        periods.forEach(p => {
            // Period Number Header
            const pHeader = document.createElement('div');
            pHeader.className = 'header-cell';
            pHeader.innerText = p;
            pHeader.id = `h-p-${p}`;
            pHeader.onclick = () => filter('period', p);
            tableContainer.appendChild(pHeader);

            // Cells
            groups.forEach(g => {
                const atom = rawData.find(a => a.p === p && a.g === g);
                const cell = document.createElement('div');
                
                if (atom) {
                    const isBlue = ['IA', 'IIA', 'IIIA'].includes(g);
                    cell.className = `cell ${isBlue ? 'bg-blue-custom' : 'bg-red-custom'}`;
                    // Special case for H (Period 1, Group IA) - usually white or specific color, but image shows white/light
                    if(atom.sym === 'H') cell.className = 'cell bg-white-custom';
                    
                    cell.innerHTML = `
                        <span class="z-index">${atom.z}</span>
                        <div class="symbol">${atom.sym}</div>
                        <div class="value">(${atom.val.toFixed(2)})</div>
                    `;
                    cell.dataset.p = p;
                    cell.dataset.g = g;
                    cell.dataset.val = atom.val;
                    cell.id = `cell-${atom.sym}`;
                } else {
                    cell.className = 'cell'; // Empty cell
                }
                tableContainer.appendChild(cell);
            });
        });
    }

    // --- CHART LOGIC ---
    let myChart = null;

    function initChart(data, label) {
        const ctx = document.getElementById('electronegativityChart').getContext('2d');
        
        // Prepare chart data
        const labels = data.map(d => d.sym);
        const values = data.map(d => d.val);
        const backgroundColors = data.map(d => {
             if(d.sym === 'H') return '#e2e8f0';
             return ['IA', 'IIA', 'IIIA'].includes(d.g) ? '#7dd3fc' : '#fca5a5';
        });

        const config = {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Độ âm điện',
                    data: values,
                    borderColor: '#475569',
                    backgroundColor: backgroundColors,
                    pointBackgroundColor: backgroundColors,
                    pointBorderColor: '#000',
                    pointRadius: 6,
                    pointHoverRadius: 9,
                    tension: 0.1,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false,
                        min: 0,
                        max: 4.5,
                        title: { display: true, text: 'Độ âm điện' }
                    },
                    x: {
                        title: { display: true, text: 'Nguyên tố' }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (context) => `Độ âm điện: ${context.parsed.y}`
                        }
                    }
                }
            }
        };

        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, config);
        
        document.getElementById('chart-desc').innerText = label;
    }

    // --- INTERACTION ---
    let currentFilter = { type: 'all', value: null };

    function filter(type, value) {
        // Toggle logic
        if (currentFilter.type === type && currentFilter.value === value) {
            reset();
            return;
        }

        currentFilter = { type, value };

        // 1. Visual updates on Table
        // Reset headers
        document.querySelectorAll('.header-cell').forEach(h => h.classList.remove('active'));
        // Highlight active header
        if (type === 'period') document.getElementById(`h-p-${value}`).classList.add('active');
        if (type === 'group') document.getElementById(`h-g-${value}`).classList.add('active');

        // Dim/Highlight cells
        document.querySelectorAll('.cell').forEach(c => {
            if (!c.dataset.p) return; // Skip empty
            
            let match = false;
            if (type === 'period' && parseInt(c.dataset.p) === value) match = true;
            if (type === 'group' && c.dataset.g === value) match = true;

            if (match) {
                c.classList.remove('dimmed');
                c.classList.add('highlight');
            } else {
                c.classList.add('dimmed');
                c.classList.remove('highlight');
            }
        });

        // 2. Update Chart
        let filteredData = [];
        let label = "";

        if (type === 'period') {
            filteredData = rawData.filter(d => d.p === value).sort((a,b) => a.z - b.z);
            label = `Biến đổi trong Chu kỳ ${value}: Từ trái sang phải, độ âm điện thường tăng.`;
        } else if (type === 'group') {
            filteredData = rawData.filter(d => d.g === value).sort((a,b) => a.p - b.p);
            label = `Biến đổi trong Nhóm ${value}: Từ trên xuống dưới, độ âm điện thường giảm.`;
        }
        
        initChart(filteredData, label);
    }

    function reset() {
        currentFilter = { type: 'all', value: null };
        document.querySelectorAll('.header-cell').forEach(h => h.classList.remove('active'));
        document.querySelectorAll('.cell').forEach(c => {
            c.classList.remove('dimmed', 'highlight');
        });
        
        // Show all sorted by Z for chart
        initChart(rawData.sort((a,b) => a.z - b.z), "Đang hiển thị toàn bộ nguyên tố theo số hiệu nguyên tử (Z).");
    }

    // --- INIT ---
    initTable();
    reset(); // Initial render

</script>
</body>
</html>
